name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

  nst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: build
        run: dotnet build nst.slnx -c Release
      - name: test
        run: dotnet test --project tests/Nst.Tests -c Release
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
