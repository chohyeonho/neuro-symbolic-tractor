name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

  nst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: build
        run: dotnet build nst.slnx -c Release
      - name: test
        run: dotnet test --project tests/Nst.Tests -c Release
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      - name: publish
        # The README's install step, so a reader who follows it gets a working native program.
        run: |
          dotnet publish src/nst -c Release -o out/nst
          out/nst/nst
      - name: native lines
        # The consumer rides the native program, so the cap is checked on it too, not only on the managed build.
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          seq 1 300 > "$RUNNER_TEMP/project/many.txt"
          NST_ROOT="$RUNNER_TEMP/project" out/nst/nst lines many.txt 1 300 > printed.txt
          test "$(wc -l < printed.txt)" -eq 120
          test "$(head -n 1 printed.txt)" = "1: 1"
          test "$(tail -n 1 printed.txt)" = "120: 120"
